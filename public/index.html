<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Gerador visual de dados fictícios em JSON, CSV e SQL."><title>JSON Forge</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell"><header><p class="eyebrow">LAB//ABERTO #003</p><h1>JSON <span>Forge</span></h1><p>Modele campos, gere dados fictícios reproduzíveis e exporte sem oferecer a planilha da empresa como sacrifício a uma API aleatória.</p></header><section class="panel"><div class="toolbar"><label>Registros<input id="count" type="number" min="1" max="1000" value="12"></label><label>Seed<input id="seed" value="lab-aberto"></label><label>Formato<select id="format"><option value="json">JSON</option><option value="csv">CSV</option><option value="sql">SQL</option></select></label><label>Tabela SQL<input id="table" value="mock_data"></label></div><div class="section-title"><div><p class="eyebrow">Schema</p><h2>Campos</h2></div><button id="add" type="button" class="ghost">Adicionar campo</button></div><div id="fields"></div><button id="generate" type="button">Gerar dados</button><p id="feedback" role="status"></p></section><section class="panel"><div class="section-title"><div><p class="eyebrow">Resultado</p><h2>Prévia</h2></div><button id="download" type="button" class="ghost">Baixar</button></div><pre id="output">Configure os campos e gere os dados.</pre></section></main><script type="module" src="/app.js"></script></body></html>
